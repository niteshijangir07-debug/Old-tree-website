<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Old Tree | Handcrafted Furniture</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, serif;
      color: #2f241d;
      background: #f7f3ed;
      line-height: 1.6;
    }

    header {
      background: #2f241d;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 28px;
      letter-spacing: 3px;
      font-weight: bold;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 22px;
      font-size: 15px;
    }

    .hero {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      background:
        linear-gradient(rgba(35,25,18,0.55), rgba(35,25,18,0.55)),
        url("https://images.unsplash.com/photo-1555041469-a586c61ea9bc?auto=format&fit=crop&w=1600&q=80")
        center/cover;
      color: white;
    }

    .hero h1 {
      font-size: 58px;
      letter-spacing: 6px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 21px;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #d4a373;
      color: #2f241d;
      padding: 13px 28px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 3px;
    }

    section {
      padding: 70px 8%;
      text-align: center;
    }

    section h2 {
      font-size: 36px;
      margin-bottom: 20px;
    }

    .intro {
      max-width: 800px;
      margin: auto;
      font-size: 18px;
    }

    .cards {
      display: flex;
      gap: 25px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 35px;
    }

    .card {
      background: white;
      padding: 30px;
      width: 280px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 23px;
    }

    .contact {
      background: #e9dfd2;
    }

    footer {
      background: #2f241d;
      color: white;
      text-align: center;
      padding: 25px;
      font-size: 14px;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        gap: 12px;
      }

      nav a {
        margin: 0 7px;
      }

      .hero h1 {
        font-size: 42px;
      }

      .hero p {
        font-size: 17px;
      }
    }
  </style>
</
